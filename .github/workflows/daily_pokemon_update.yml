name: Daily Pokemon Rarity Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run rarity optimization
        run: python scripts/antigravity_agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokemon_data.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily pokemon rarity scores"
            git push origin main
          fi
