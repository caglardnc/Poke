name: Otonom Pokemon Ajani
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'
jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Calistir
        run: |
          python scripts/antigravity_agent.py
          python -m unittest discover tests/
      - name: Commit
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@caglardinc.com"
          git add .
          git commit -m "Otonom guncelleme" || exit 0
          git push
