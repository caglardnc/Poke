name: Otonom Pokemon Ajani

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ANTIGRAVITY_TOKEN }}
          fetch-depth: 0

      - name: Ortami Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Sistemi Temizle ve Calistir
        run: |
          # Yanlış açılan klasörleri zorla temizle
          rm -rf .github/workflows/data .github/workflows/scripts .github/workflows/tests
          # Ajanı çalıştır
          python scripts/antigravity_agent.py

      - name: Kaydet ve Zorla Gonder
        run: |
          git config --global user.name "AntigravityBot"
          git config --global user.email "bot@caglardinc.com"
          git add .
          git commit -m "Antigravity: Sistem temizlendi ve optimize edildi." || exit 0
          git push origin main
