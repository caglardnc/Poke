name: Otonom Pokemon Ajani

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ortami Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ajan Calisiyor
        run: |
          python scripts/antigravity_agent.py

      - name: Testleri Kos
        run: |
          python -m unittest discover tests/

      - name: Kaydet ve Gonder
        run: |
          git config --global user.name "AntigravityBot"
          git config --global user.email "bot@caglardinc.com"
          
          # 1. Uzak sunucudaki (senin telefondan yaptığın) değişiklikleri çek
          git fetch origin main
          
          # 2. Kendi değişikliklerini senin yaptıklarının üzerine 'rebase' et
          git rebase origin/main
          
          git add .
          
          # 3. Sadece bir değişiklik varsa commit at
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Otonom: Tum pokemonlar optimize edildi."
            git push origin main
          else
            echo "Degisiklik yok, push edilmiyor."
          fi
