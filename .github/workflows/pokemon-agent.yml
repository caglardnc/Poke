name: Otonom Pokemon Ajani

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Yazma yetkisini buradan da garantiye alıyoruz
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tüm geçmişi çek ki çakışma olmasın

      - name: Ortami Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ajan Calisiyor
        run: |
          # Ajan verileri optimize eder
          python scripts/antigravity_agent.py

      - name: Testleri Kos
        run: |
          # Hata varsa burada durur ve kaydetmez
          python -m unittest discover tests/

      - name: Kaydet ve Gonder
        run: |
          git config --global user.name "AntigravityBot"
          git config --global user.email "bot@caglardinc.com"
          
          # Çakışmaları önlemek için önce güncel hali çekiyoruz
          git pull --rebase origin main
          
          git add .
          # Sadece değişiklik varsa commit at, yoksa hata verme
          git diff-index --quiet HEAD || git commit -m "Otonom: Tum pokemonlar optimize edildi."
          
          git push origin main
